<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Day Explorer</title>
<style>
:root{--bg:#0b0f0e;--tile:#121816;--line:#222c28;--ink:#e9efec;--dim:#87948e;--green:#00AB51;--amber:#F2A93B;--red:#E5534B;--grey:#9aa6a0;--gap:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,sans-serif}
#app{padding-bottom:160px}
button{font-family:inherit}

/* header */
.top{max-width:1600px;margin:0 auto;padding:22px 24px 6px}
.top h1{margin:0;font-size:22px;font-weight:650}
.top .sub{margin:4px 0 0;color:var(--dim);max-width:900px}

/* board */
.board{max-width:1600px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.ch{grid-column:1/-1;margin:22px 0 -4px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);scroll-margin-top:16px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;min-width:0;transition:border-color .15s;scroll-margin-top:16px}
.tile:hover{border-color:#34433d}
.thead{display:flex;align-items:center;gap:10px}
.tile h3{margin:0;font-size:15px;font-weight:620;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.badge{flex:none;font-size:11px;font-weight:600;line-height:16px;color:var(--grey);border:1px solid var(--grey);border-radius:6px;padding:0 6px}
.info{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid #3a4842;background:transparent;color:var(--dim);font:600 12px/1 Georgia,serif;cursor:pointer;padding:0}
.info:hover,.tile.open .info{color:var(--ink);border-color:#56665f}
.tile.open .info{background:#1c2522}
.what{margin:3px 0 10px;color:var(--dim);font-size:13px}
.cvwrap{overflow-x:auto;overflow-y:hidden}
.cvwrap canvas{display:block;cursor:crosshair}
.more{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:6px;color:#c9d2ce;font-size:13px}
.tile.open .more{display:block}
.more h4{margin:10px 0 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.more p{margin:4px 0}
.more ul{margin:4px 0;padding-left:18px}.more li{margin:2px 0}
.note{display:flex;gap:8px;align-items:baseline}
.jump{flex:none;background:#1c2522;color:var(--green);border:0;border-radius:6px;padding:1px 7px;font-weight:600;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums}
.jump:hover{background:#24302b}
.err{color:var(--red);font-size:13px}.err:empty{display:none}

/* Shift Planner's control row */
.pctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:10px}
.pgrp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pctl .lab{color:var(--dim);font-size:12px;margin-right:2px}
.pctl input[type=range]{width:150px;accent-color:#fff}
.pctl .out{color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums;min-width:110px}
.chip{background:#1c2522;color:var(--dim);border:0;border-radius:999px;padding:4px 10px;font:500 12px system-ui;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink)}.chip.on{background:#2f3d37;color:#fff}

@media (max-width:899.98px){.tile{grid-column:1/-1 !important}.board{padding:0 16px}.top{padding:18px 16px 6px}}

#tip{position:fixed;pointer-events:none;display:none;z-index:70;background:#1b2421;border:1px solid #33413b;border-radius:8px;padding:8px 10px;font-size:12px;max-width:260px}
#tip b{display:block;margin-bottom:2px}
/* a touch tap's tooltip takes taps: its Open button opens the mark's card */
#tip.tap{pointer-events:auto}
#tip .tipo{display:block;width:100%;min-height:40px;margin-top:8px;background:#fff;color:#0b0f0e;border:0;border-radius:999px;font:650 13px system-ui;cursor:pointer}

/* tile header touch buttons: expand (opens Focus) on touch screens and phones; Key where the key is not out at rest (touch) */
.tkey,.tfocus{display:none;flex:none;align-items:center;justify-content:center;border:1px solid #3a4842;background:transparent;color:var(--dim);cursor:pointer;padding:0}
.tfocus{width:22px;height:22px;border-radius:50%;font:600 13px/1 system-ui}
.tkey{height:22px;border-radius:999px;padding:0 10px;font:600 11px system-ui}
.tkey.on{background:#2f3d37;color:#fff;border-color:#56665f}
body.touch .tfocus{display:inline-flex}
body.touch .tile:not(.keyout) .tkey{display:inline-flex}
body.touch .tfocus,body.touch .thead .info{width:40px;height:40px}
body.touch .tkey{height:40px;padding:0 14px}
@media (max-width:600px){.tfocus{display:inline-flex}.tfocus,.thead .info{width:40px;height:40px}.tkey{height:40px;padding:0 14px}}

/* glass control bar */
.glass{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;width:min(1180px,calc(100vw - 32px));background:rgba(30,38,35,.62);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.09);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:12px 14px 12px 18px;transition:padding .3s ease;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:center}
/* One width and place in every state (Board, Story, expanded, slim): only the height changes, so the pill never moves on screen.
   The bar is a grid: row 1 is the top row with the pill at its right end; the rows below use the full width. */
.gbody{display:contents}
.gmain{grid-row:1;grid-column:1}
.gctx{grid-row:2;grid-column:1/-1}
.glass button{white-space:nowrap}
.gmain{display:grid;grid-template-columns:auto auto 64px minmax(0,1fr);gap:14px;align-items:center}
.glass .pp{background:#fff;color:#0b0f0e;border:0;border-radius:999px;padding:8px 16px;font:650 13px system-ui;cursor:pointer;min-width:66px}
.glass .sp{background:rgba(255,255,255,.08);color:var(--ink);border:0;border-radius:999px;padding:7px 12px;font:600 13px system-ui;cursor:pointer;min-width:44px}
.glass .clk{font:600 22px/1 -apple-system,system-ui;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:right}
.glass .track{position:relative;height:34px;min-width:0}
.glass .spark{position:absolute;left:0;top:2px;pointer-events:none}
.glass .rail,.glass .fill{position:absolute;top:24px;height:4px;border-radius:2px;pointer-events:none}
.glass .rail{left:0;right:0;background:rgba(255,255,255,.12)}
.glass .fill{left:0;background:#fff}
.glass .knob{position:absolute;top:19px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.glass .tick{position:absolute;top:30px;transform:translateX(-50%);font-size:10px;line-height:1;color:rgba(255,255,255,.45);pointer-events:none}
.glass .scrub{position:absolute;left:-7px;right:-7px;top:12px;height:24px;width:calc(100% + 14px);margin:0;opacity:0;cursor:pointer;z-index:2}
.glass .pin{position:absolute;top:20px;width:5px;height:12px;margin-left:-2px;background:var(--amber);border:0;border-radius:2px;padding:0;cursor:pointer;z-index:3}
.glass .pin:hover,.glass .pin:focus-visible{transform:scaleY(1.3)}
.pinlab{display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1b2421;border:1px solid #33413b;border-radius:6px;padding:2px 7px;font-size:11px;color:var(--ink);pointer-events:none}
.pin:hover .pinlab,.pin:focus-visible .pinlab{display:block}
.gctx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);min-height:30px}
.glass.noctx .gctx{display:none}
.glab{color:rgba(255,255,255,.5);font:600 11px system-ui;text-transform:uppercase;letter-spacing:.06em;margin:0 4px 0 2px}
.gchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:0;border-radius:999px;padding:5px 11px;font:500 12px system-ui;cursor:pointer}
.gchip:hover{color:#fff}.gchip.on{background:rgba(255,255,255,.16);color:#fff}
.gtoggle{margin-left:auto}
.gtoggle::before{content:'';width:8px;height:8px;border-radius:50%;border:1px solid currentColor}
.gtoggle.on::before{background:currentColor}
.gcoll{position:absolute;right:14px;top:-12px;width:28px;height:22px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(30,38,35,.92);color:var(--ink);cursor:pointer;font-size:12px;padding:0;z-index:4}
/* collapsed: still scrubbable (Play, clock, a shorter track with pins and the activity line) */
.glass.mini{padding-top:8px;padding-bottom:8px}
.glass.mini .gctx{display:none}
.glass.mini .gmain{grid-template-columns:auto 56px minmax(0,1fr);gap:12px}
.glass.mini .sp,.glass.mini .tick{display:none}
.glass.mini .track{height:26px}
.glass.mini .rail,.glass.mini .fill{top:15px}.glass.mini .knob{top:10px}.glass.mini .pin{top:11px}.glass.mini .scrub{top:4px}
.glass.mini .clk{font-size:18px}
.glass.mini .pp{padding:6px 12px}
@media (max-width:700px){.gmain{grid-template-columns:auto auto 1fr}.gmain .track{grid-column:1/-1;grid-row:2}.glass .clk{text-align:left}}

/* phone (bar.js .phone, window at most 600 px): two slim rows. Row 1: Play, clock, then the pill and More at the right; row 2 the
   full-width track with its pins. gmain spans the bar (its own two rows); the pill and More sit over its first row's right end.
   The context row (and the speed) is a sheet above both, opened by More or by a layer that needs it (Focus). Tap targets 40 px. */
.glass .gmore{display:none}
.glass.phone{grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;padding:8px 12px 6px}
.glass.phone .gmain{grid-row:1;grid-column:1/-1;grid-template-columns:auto auto minmax(0,1fr);gap:4px 12px}
.glass.phone .pp{min-width:0;height:40px;padding:0 16px}
.glass.phone .clk{font-size:18px;text-align:left}
.glass.phone .gmain .track{grid-row:2;grid-column:1/-1;height:40px}
.glass.phone .scrub{top:0;height:40px}
.glass.phone .pin{top:0;width:11px;height:40px;margin-left:-5px;background:transparent}
.glass.phone .pin::before{content:'';position:absolute;left:4px;top:20px;width:3px;height:12px;border-radius:1px;background:var(--amber)}
.glass.phone .pin:hover,.glass.phone .pin:focus-visible{transform:none}
.glass.phone .modes{grid-row:1;grid-column:2;align-self:start;padding:0}
.glass.phone .modes button{height:40px;padding:0 13px;font-size:13px}
.glass.phone .gmore{display:inline-flex;grid-row:1;grid-column:3;align-self:start;width:40px;height:40px;align-items:center;justify-content:center;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:var(--ink);font:700 16px/1 system-ui;cursor:pointer;padding:0}
.glass.phone .gmore.on{background:rgba(255,255,255,.2)}
.glass.phone .gcoll{width:44px;height:26px;top:-16px}
.glass.phone .gcoll::after{content:'';position:absolute;left:0;right:0;top:-7px;bottom:-7px}
.glass.phone:not(.isstory) .gctx{display:none}
.glass.phone.sheet:not(.isstory) .gctx{display:flex;grid-row:1;grid-column:1/-1;margin:0 0 8px;padding:2px 0 10px;border-top:0;border-bottom:1px solid rgba(255,255,255,.07);max-height:min(44vh,340px);overflow-y:auto;gap:8px}
.glass.phone.sheet:not(.isstory) .gmain,.glass.phone.sheet:not(.isstory) .modes,.glass.phone.sheet:not(.isstory) .gmore{grid-row:2}
.glass.phone.sheet .gchip,.glass.phone.sheet .sp{min-height:40px;padding:0 14px}
.glass.phone.sheet .gpinx{width:40px;height:40px}
.glass.phone.sheet .gpctl input[type=range]{width:100%;min-height:40px}
.glass.phone.sheet .gpctl .pgrp{flex-basis:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.glass.phone.sheet .gpctl .pgrp::-webkit-scrollbar{display:none}
.glass.phone.sheet .gpctl .pgrp>*{flex:none}
.glass.phone.sheet .gpctl .pgrp input[type=range]{flex:1 0 150px;width:auto}
.glass.phone.sheet .gpctl .pshift{flex:none}
.glass.phone.isstory{grid-template-columns:minmax(0,1fr) auto}
.glass.phone.isstory .gmore{display:none}
.glass.phone.isstory .sbar .dots{display:none}
/* phone, collapsed: the scrubber row only (the clock small at its left) */
.glass.phone.mini{grid-template-columns:minmax(0,1fr)}
.glass.phone.mini:not(.isstory) .pp,.glass.phone.mini:not(.isstory) .modes,.glass.phone.mini .gmore{display:none}
.glass.phone.mini .gmain{grid-template-columns:auto minmax(0,1fr)}
.glass.phone.mini .gmain .clk{grid-row:1;grid-column:1;font-size:14px}
.glass.phone.mini .gmain .track{grid-row:1;grid-column:2;height:40px}
.glass.phone.mini .tick{display:block}
.glass.phone.mini .rail,.glass.phone.mini .fill{top:24px}.glass.phone.mini .knob{top:19px}.glass.phone.mini .pin{top:0}.glass.phone.mini .scrub{top:0}
.glass.phone.isstory.mini{grid-template-columns:minmax(0,1fr) auto}

/* Board/Story pill: the bar's last child, at the right end of the top row in every state */
.glass .modes{grid-row:1;grid-column:2;display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px}
.glass .modes button{border:0;border-radius:999px;padding:5px 12px;font:600 13px system-ui;cursor:pointer;background:transparent;color:var(--dim)}
.glass .modes button.on{background:rgba(255,255,255,.16);color:var(--ink)}
.glass .modes button:hover{color:var(--ink)}
/* Pop-up layers and the dial card */
.layer{position:fixed;inset:0;z-index:45;background:rgba(4,7,6,.62);display:flex;align-items:center;justify-content:center;padding:16px 16px calc(var(--barH,124px) + 30px)}
.pbox{background:var(--tile);border:1px solid #33413b;border-radius:16px;width:min(460px,100%);max-height:100%;overflow:auto;padding:14px 18px 16px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.pnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pnav button{background:#1b2421;color:var(--ink);border:1px solid #33413b;border-radius:8px;padding:5px 10px;font:600 13px system-ui;cursor:pointer}
.pnav .ppos{flex:1;text-align:center;color:var(--dim);font-size:12px}
.phost .eyebrow{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.phost h4{margin:2px 0 4px;font-size:17px}
.phost .now{font:700 34px/1.1 system-ui;font-variant-numeric:tabular-nums}
.phost .nowlbl,.phost .hint,.phost .stat .l{color:var(--dim);font-size:12px}
.phost p{margin:8px 0}.phost p.why{color:var(--dim)}
.phost canvas{display:block;width:100%;cursor:pointer;margin-top:6px}
.phost .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.phost .stat .v{font:650 18px system-ui}
.phost button.ghost{margin-top:6px;background:transparent;color:var(--ink);border:1px solid #33413b;border-radius:8px;padding:4px 10px;font:600 12px system-ui;cursor:pointer}
body.layered{overflow:hidden}
.rcard h4{margin:2px 0 8px}
.rrows{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.rrow{display:contents}
.rrow .l{color:var(--dim)}
.rrow .v{font-variant-numeric:tabular-nums}
.phost canvas.mini{cursor:default;margin-top:10px}
.phost button.open{margin-top:10px}

/* Focus: one view full screen, explanation beside it; the glass bar stays above it (z-index) */
.pbox.fbox{width:auto;max-width:100%;padding:12px 18px 16px}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fhead h3{flex:1;margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.fhead .px{background:#1b2421;color:var(--ink);border:1px solid #33413b;border-radius:8px;padding:5px 10px;font:600 13px system-ui;cursor:pointer}
.fbody{display:flex;gap:20px;align-items:flex-start}
.fbody.narrow{flex-direction:column}
.fmain{flex:none;min-width:0}
.fcv{display:block;cursor:grab;touch-action:none}
.fcv:active{cursor:grabbing}
.fstrip{display:block;margin-top:8px;cursor:ew-resize;touch-action:none}
.fside{flex:1;min-width:0;max-width:300px;font-size:13px;overflow:auto}
.fside .what{margin:0 0 10px;color:var(--dim)}
.fside h4{margin:12px 0 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.fside p{margin:4px 0}
.fwin{border-left:2px solid #33413b;padding:2px 0 2px 10px;margin:6px 0 4px}
.fwin .wlab{color:var(--ink)}
.fwin .wcount{font-variant-numeric:tabular-nums}
.fwin .wnote{color:var(--amber)}
.fwin div:empty{display:none}
/* Focus on a phone: a full-screen sheet, the chart on top at full width, How to read folded under it */
.fsidet{display:none}
.fbody.phone{gap:8px}
.fbody.phone .fside{max-width:none;width:100%}
.fbody.phone .fsidet{display:flex;align-items:center;width:100%;min-height:40px;margin-top:8px;background:#1b2421;border:1px solid #33413b;border-radius:10px;color:var(--ink);font:600 13px system-ui;padding:0 12px;cursor:pointer}
.fbody.phone .fsidet::after{content:'⌄';margin-left:auto}
.fbody.phone .fside.open .fsidet::after{content:'⌃'}
.fbody.phone .fmore{display:none}
.fbody.phone .fside.open .fmore{display:block}
.fbody.phone .fhow{display:none}
.fbody.phone .fside>.what,.fbody.phone .fwin{display:none}
.fbody.phone .fside.open>.what,.fbody.phone .fside.open .fwin{display:block}
@media (max-width:600px){
  .layer.flayer{padding:0 0 calc(var(--barH,64px) + 30px);align-items:stretch}
  .layer.flayer .pbox.fbox{width:100%;border-radius:0 0 16px 16px;border-width:0 0 1px;padding:10px 12px 12px}
  .fhead .px{min-height:40px;padding:0 14px}
}
.gring::before{content:'';width:8px;height:8px;border-radius:50%;border:1px solid var(--c,currentColor)}
.gring.on::before{background:var(--c,currentColor)}
.gring:not(.on){opacity:.55}
.gzoom{min-width:30px;justify-content:center;font-size:14px}
.gwin{min-width:0}
.gpctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;flex-basis:100%}
.gpctl .pgrp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gpctl .lab{color:rgba(255,255,255,.55);font-size:12px}
.gpctl .out{color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums;min-width:96px}
.gpctl input[type=range]{width:120px;accent-color:#fff}
.gpctl .pshift{display:inline-flex;align-items:center;gap:6px;margin-right:10px}
.gpctl .pshift .out{min-width:0}
.gpctl .pshift input[type=range]{width:90px}
.gctx .gpctl.ginline{display:contents}
.gpctl.ginline .pgrp{margin-left:8px}
.gpctl.ginline .pgrp.pshifts{flex-basis:100%;margin-left:0}
.gwin{text-transform:none;letter-spacing:0;font-weight:500;color:rgba(255,255,255,.8)}
.ghint{text-transform:none;letter-spacing:0;font-weight:500}

/* Story: the stage (left, fitted to the window above the bar) and the steps (right, scrolling) */
.story{display:none}
body.mode-story .top,body.mode-story .board{display:none}
body.mode-story .story{display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,24vw,420px);gap:28px;padding:16px 28px 0;align-items:start}
.story .stage{position:sticky;top:16px;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.story .panes{position:relative}
.story .pane{position:absolute}
.story .ptitle{height:22px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden}
.story .pname{overflow:hidden;text-overflow:ellipsis}
.story .ptitle .info{width:18px;height:18px;font-size:11px}
.story .pane canvas{display:block;cursor:crosshair}
.story .passume{display:none;position:absolute;left:0;right:0;top:22px;z-index:2;background:rgba(18,24,22,.96);border:1px solid #33413b;border-radius:10px;padding:8px 12px;font-size:13px;color:#c9d2ce}
.story .pane.open .passume{display:block}
.story .passume h4,.story .branch h4{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.story .assume{margin:4px 0;padding-left:18px}.story .assume li{margin:2px 0}
.story .scap{display:none;margin:10px 2px 0;font-size:17px;line-height:1.4;max-width:900px}
.story .scap.on{display:block}
.story .scap.sghost{position:absolute;margin:0;pointer-events:none}
.story .steps{position:relative;padding-top:6px;min-width:0}
.story .stitle{margin:6px 0 0;font:650 20px/1.2 -apple-system,system-ui;letter-spacing:-.01em}
.story .step{min-height:52vh;padding-top:18vh;opacity:.35;transition:opacity .25s}
.story .step:first-of-type{padding-top:12vh}
.story .step.on{opacity:1}
.story .when{color:var(--green);font-weight:650;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;font-variant-numeric:tabular-nums}

ds going home. Hover a dot for its time.","notice":[{"text":"The morning swells as kids and mentors arrive. The afternoon pours out as {kidsReleased} kids with a home time go home.","jump":468}]},"daylines":{"title":"Day Lines","what":"Each kid is a thread across the day. Amber while waiting for a group, green while out, ending when they go home.","read":"Threads are in order of arrival. Kids with no recorded home time are left out. Hover a thread for that kid's times.","notice":[{"text":"{kidsReleased} kids have a home time, so they are the threads. Kids waited {medianKidWait} minutes for a group at the median.","jump":231}]},"oneline":{"title":"One Line","what":"One track with five stops. Dots slide along it as the clock runs, and mentor pairs drop in from above.","read":"White dots are kids arriving, amber dots are waiting, green dots are out shopping and teal dots are at checkout. Blue dots are mentor pairs. The number under a stop is how many kids are there. Checkout starts about when the mentor was texted, estimated from the median text-to-release time.","notice":[{"text":"Watch the Waiting stop fill and drain. Kids waiting peaked near {peakKidsWaitingAt}.","jump":231}],"ui":{"stops":["Arrive","Waiting","Out shopping","Checkout","Home"]}},"bottleneck":{"title":"Where the Line Was","what":"The three places people could be stuck, side by side, and which one was the choke point every {binMinutes} minutes.","read":"Each lane is how many were waiting at that minute, on one shared scale. The strip on top takes the colour of the lane with the most people stuck, brighter when more were waiting. Hover for the counts.","notice":[{"text":"Mentor pairs waiting peaked at {peakPairsWaiting} at {peakPairsWaitingAt}.","jump":175},{"text":"Kids waiting for a group peaked at {peakKidsWaiting} at {peakKidsWaitingAt}. Kids and mentors took turns waiting.","jump":231},{"text":"Families waiting at checkout peaked at {peakFamiliesWaiting} at {peakFamiliesWaitingAt}. After the morning, checkout was the only line.","jump":307}],"ui":{"strip":"Choke point every","lanesShort":["Kids","Pairs","Families"],"minutes":"minutes","lanes":["Kids waiting for a group","Mentor pairs waiting for a kid","Families waiting at checkout"],"now":"now","peak":"peak","at":"at","choke":"Choke point","nobody":"Nobody waiting"}},"tide":{"title":"The Tide","what":"How many kids were on site at each minute, split by what they were doing, with mentors on site as a line.","read":"Amber kids are waiting for a group. Green kids are out shopping. Teal kids are heading back after the mentor text. Each wave of arrivals lifts the tide and checkout drains it. Hover for the counts.","notice":[{"text":"The most kids on site at once was {peakTide}, at {peakTideAt}.","jump":293},{"text":"Kids with no home time recorded are left out, so the tide counts {kidsReleased} kids."}],"ui":{"states":["Waiting for a group","Out shopping","Heading back"],"mentors":"Mentors on site","onSite":"Kids on site now","at":"At","hit":{"onSite":"kids on site","waiting":"waiting for a group","out":"out shopping","back":"heading back","mentors":"mentors on site"}}},"ready":{"title":"Ready on Arrival","what":"One square per kid, grouped by the hour they checked in. Green means a group formed within {kidFastMin} minutes. Amber and red mean a longer wait.","read":"An outline is a kid still waiting. It fills in when the kid gets a group. The percent beside each hour is the share that waited under {kidFastMin} minutes. Grey squares are kids whose match time was only estimated, so they are left out of the percent. Hover a square for that kid's times.","notice":[{"text":"Of kids with a known wait who checked in at 9 am, {kidsFastPct9} had a group within {kidFastMin} minutes. At 10 am only {kidsFastPct10} did."},{"text":"The median kid waited {medianKidWait} minutes for a group."}],"ui":{"fast":"fast","estimated":"time estimated","waiting":"still waiting","under":"under","orMore":"or more","hit":{"waited":"Waited","estimatedWait":"Wait unknown, match time estimated","waitingFor":"Waiting","gotKid":"Got a kid"}}},"waitedwhom":{"title":"Who Waited for Whom","what":"The same squares from both sides. Left: kids by check-in hour. Right: mentor pairs by the hour they paired.","read":"Green is a quick match. Kids are fast under {kidFastMin} minutes, pairs under {pairFastMin}. Whichever side has more amber and red was standing around that hour. Grey kids have an estimated match time and are left out of the percent. An outline is still waiting.","notice":[{"text":"By 10 am only {pairsFastPct10} of arriving pairs got a kid within {pairFastMin} minutes. Of kids with a known wait, only {kidsFastPct10} got a group within {kidFastMin}."},{"text":"Both sides waited at once. The median pair waited {medianPairWait} minutes."}],"ui":{"kids":"kids","pairs":"mentor pairs","estimated":"time estimated","waiting":"still waiting"}},"whatif":{"title":"Smoothing the Waits","what":"The real morning against a replay of the same arrivals. In the replay, groups leave as soon as a kid and a mentor pair are both there.","read":"Shaded areas are the real day. White lines are the replay. It is a replay, not a measurement: it ignores shift briefings and anything else that held groups back. A pair takes two kids when at least two are waiting and kids outnumber pairs, counting those still to arrive. Otherwise it takes one.","assumptions":["Same real arrivals: each kid's check-in time and each mentor pair's pairing time.","Groups leave as soon as a kid and a mentor pair are both there.","A pair takes two kids when at least two are waiting and kids outnumber pairs, counting those still to come.","A pair's pairing time stands in for when its mentors arrived.","No shift briefings, bus waits or walking time."],"notice":[{"text":"In the replay the median kid wait falls from {realKidWaitMed} to {replayKidWaitMed} minutes, and the most kids waiting from {peakKidsWaiting} to {replayPeakKids}."},{"text":"Mentor pairs waiti ot shorten it. Texting mentors sooner would.","jump":307}],"ui":{"desk":"At the desk, not texted yet","walk":"Texted, waiting for the walk back","peak":"peak","parentToText":"Parent to text, median","secUnit":"s","textToRelease":"Text to release, median","minUnit":"min","at":"At","deskLine":"families at the desk, not texted","walkLine":"families texted, waiting for the walk back"}},"bydesk":{"title":"Checkout Clock by Desk","what":"The same clock, coloured by the desk that released each family. The desk list counts families per desk as they go home.","read":"Each colour is one desk. Distance from the centre is minutes from text to release. Bigger dots are more kids. Hover a dot for its desk and times.","notice":[{"text":"Families by desk, Desk 1 first: {deskCounts}."}],"ui":{"min":"min"}},"busyslow":{"title":"Slow When Busy?","what":"One dot per family. Across is how many families were at checkout when the parent arrived. Up is minutes from text to release.","read":"If dots climb to the right, busy times were slower. Bigger dots are more kids. Purple is a family split across groups. Hover a dot for its times.","notice":[{"text":"With {busyAt} or more families at checkout, the median text to release was {busyMedian} minutes. With fewer than {quietBelow}, it was {quietMedian}."}],"ui":{"min":"min","axis":"families at checkout when they arrived"}},"everywait":{"title":"Every Wait","what":"Three rows of dots, one dot per wait. Each dot drops in the minute that wait ended. Longer waits sit further right.","read":"Top row is a kid waiting for a group. Middle is a kid's time out, from getting a group to going home. Bottom is a family waiting from the mentor's text to release. The dashed line is each row's median. Kids whose group time was only estimated are left out. Hover a dot for its times.","notice":[{"text":"The median kid waited {medianKidWait} minutes for a group, then was out {medianShopHours} hours, from group to home."},{"text":"The median family waited {medianTextToRelease} minutes from text to release."}],"ui":{"kidGroup":"kid to group","shopping":"time out","textRelease":"text to release","soFar":"so far","median":"median","min":"min","sec":"s","hr":"h","hit":{"waited":"Waited","shopped":"Time out"}}},"bygroups":{"title":"Bigger Family, Longer Wait?","what":"Families are split into rows by how many groups their kids were spread across. Each family drops in when it was released.","read":"Across is minutes from the mentor's text to release. The white line is the row's median. If bigger rows sit further right, spread-out families waited longer. Hover a dot for the family.","notice":[{"text":"Families with all kids in one group waited a median of {medianOneGroup} minutes. Families split across groups waited {medianManyGroups}."}],"ui":{"group":"group","groups":"groups","plus":"+","families":"families","min":"min"}},"waitingwent":{"title":"Where the Waiting Went","what":"All the waiting added up as person-minutes. Each dot is {waitDotMin} person-minutes, and the field fills as the day goes on.","read":"Amber is kids waiting for a group. Blue is mentors waiting for a kid, two to a pair. White is parents waiting at checkout. Hover a field for its total.","notice":[{"text":"Mentors spent {mentorWaitHours} hours waiting for a kid. Kids waited {kidWaitHours} hours for a group. Parents waited {parentWaitHours} hours at checkout.","jump":231}],"ui":{"kids":"kids","mentors":"mentors","parents":"parents","unit":"person-minutes","now":"waiting now","people":"people so far"}},"lanes":{"title":"Station Lanes","what":"One lane for each station laptop. Every action a volunteer took shows up as a tick, and the number on the right is that laptop's running count.","read":"Each colour is a job: check-in, pairing, matching, checkout desk, release, and fixes. Time runs left to right. Hover a lane for its nearest action.","notice":[{"text":"{stationCount} laptops took part. Station {busiestStation} was busiest with {busiestStationActions} actions hift {shortShift} had {shortShiftKids} kids for {shortShiftPairs} pairs, {shortShiftPerPair} per pair, and the longest kid waits at {shortShiftKidWait} minutes.","jump":230},{"text":"Shifts {spareShifts} had mentors to spare, at {spareShiftsPerPair} kids per pair."}],"ui":{"pairsBar":"mentor pairs arrived","kidsBar":"kids arrived","endTick":"final count","axisTitle":"people arrived","perPair":"kids per pair","perPairShort":"per pair","kidsShort":"kids","pairsShort":"pairs","shift":"Shift","kidsWaited":"kids waited","pairsWaited":"pairs","min":"min","hit":{"shift":"Shift","pairs":"Mentor pairs","kids":"Kids","soFar":"so far","inAll":"in all","perPair":"kids per pair","finalWas":"final","waits":"Median waits","kidsShort":"kids","pairsShort":"pairs","forming":"Waits: still forming","min":"min"}}},"planner":{"title":"Shift Planner","what":"Move each shift's mentor bus, choose when matching starts and how many stations match, and see how the same arrivals would have waited.","read":"Amber is kids waiting and blue is mentor pairs waiting. The filled shape is the real day and the bright line is your plan. The big numbers on top are your plan; each caption gives the real day. Triangles on the time axis mark where each shift's bus lands. Dashed lines mark when each shift left the auditorium for the Walmart buses. On the day matching began only then, and one station formed every group. Each station forms one group every {stationSec} seconds, the busy rate we measured. A pair leaves with fewer kids only while its shift's other pairs can still take every kid left, so every kid gets a group. A shift with no pairs left borrows a spare pair from another shift, and an extra station is only used when it helps. The curve on the right shows kid waiting against mentor waiting for every bus setting, at your matching setting. This is a model of the same arrivals. A pair's paired time stands in for when mentors arrived. It does not model briefings or walking time.","assumptions":["Same real arrivals. Each shift's pairs keep their real spread, and the whole clump moves with the bus.","A pair's pairing time stands in for when its mentors arrived.","When the shift leaves: a shift's matching starts when it left the auditorium on the day.","Each station forms one group every {stationSec} seconds, the busy rate we measured.","Every kid gets a group. A shift with no pairs left borrows a spare pair from another shift.","No briefings or walking time.","At the real settings the model gives {matchShift1KidMin} kid-min and {matchShift1PairMin} pair-min. The day measured {matchRealKidMin} and {matchRealPairMin}."],"notice":[{"text":"Matching when the shift left, with one station, the model gives {matchShift1KidMin} kid-minutes waiting. The real day measured {matchRealKidMin}."},{"text":"A second station cuts kid waiting to {matchShift2KidMin} minutes, {matchTwoCut}% less. Matching as people arrive cuts it to {matchArrive1KidMin}, {matchArriveCut}% less."},{"text":"Once matching starts on arrival, the bus time matters. Landing the bus with the kids then gives {matchWithKidMin} kid-minutes and {matchWithPairMin} pair-minutes."}],"ui":{"presets":{"real":"Real day","plan":"The plan","early10":"Bus {busEarly10} min early","early5":"Bus {busEarly5} min early","with":"Bus with kids"},"global":"All shifts","shift":"Shift","slider":"Bus lands vs kids","busLabel":"Mentor bus:","busBefore":"min before kids","busAfter":"min after kids","busSame":"same time as kids","busReal":"as on the real day","busMixed":"set per shift","perShift":"Per shift","kidsLane":"Kids waiting","pairsLane":"Pairs waiting","plan":"Your plan","ghost":"Real day","kidMinutes":"kid-minutes waiting","short":{"kidMinutes":"kid-min","pairMinutes":"pair-min","peakKids":"kids at peak","medKid":"median wait"},"pairMinutes":"pair-minutes waiting","peakKids":"most kids waiting at once","medKid":"median kid wait, min","min":"min","curve":"Trade-off","curveX":"kid-minutes waiting","curveY":"pair-minutes waiting", // ---- app/main.js
// EX.mountApp: one clock, one state, the Board and the glass bar, wired together. Plain browser script on the EX namespace.
var EX = (typeof EX !== 'undefined') ? EX : {};
(function () {
  var BAR_GAP = 40; // page content keeps this much clear above the bar

  EX.mountApp = function (root, d, copy) {
    var doc = root.ownerDocument || document, win = doc.defaultView || null, site = copy.site;

    var facts = EX.facts(d);

      var e = doc.createElement(tag);

    var state = EX.createState(clock, timers);

    // Esc with no pop-up open and no Story branch to close unpins the highlight. Registered before the cards' and the Story's own
    // Esc handlers, so it sees the stack as it was: an Esc that closes a pop-up or a branch does only that.
    var cards = null, story = null;

    var head = el('header', 'top', null, root);
    el('h1', '', site.title, head);
    el('p', 'sub', EX.fillCopy(site.intro, facts), head);
    var board = EX.mountBoard(root, state, d, copy);

    // The bar sits before the page in the document (it is fixed to the bottom of the window), so its time slider is the
    // first range on the page.
    var chrome = el('div', 'chrome', null, null);

    var bar = EX.createBar(chrome, state, d, copy);
    // Pop-ups come after the bar so the bar's Space handler runs first.
    cards = EX.mountCards(root, state, d, copy);
    board.onDial = function (key) { cards.openDial(key); };
    // A click on a mark opens its card and pins its highlight (records that link only); a click on empty space drops the pin

    board.onRecord = function (rec, viewId) {

      if (EX.highlightable(rec)) state.set('pinned', rec);

    focus.onRecord = board.onRecord;
    focus.onDial = function (key) { cards.openDial(key); };

EX.mountApp(document.getElementById('app'), DATA, COPY);
