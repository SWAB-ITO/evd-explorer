<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWAB Event Day Explorer</title>
<meta name="robots" content="noindex">
<style>
  :root { --green:#00AB51; --ink:#1b1f1d; --muted:#5d6661; --bg:#f7f8f7; --card:#fff; --line:#e3e6e4; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eef1ef; --muted:#a3ada7; --bg:#121513; --card:#1b1f1d; --line:#2c322e; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  h1 span { color:var(--green); }
  p { color:var(--muted); margin:0 0 28px; }
  a.year { display:flex; justify-content:space-between; align-items:center; padding:18px 20px; margin-bottom:12px;
    background:var(--card); border:1px solid var(--line); border-left:6px solid var(--green); border-radius:10px;
    color:inherit; text-decoration:none; }
  a.year:hover { border-color:var(--green); }
  a.year b { font-size:1.25rem; }
  a.year small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1><span>SWAB</span> Event Day Explorer</h1>
  <p>How each Shop with a Bulldawg event day ran: arrivals, matching, waits and checkout, minute by minute. Counts and times only; no names or contact details.</p>
  <a class="year" href="2026/"><b>2026</b><small>November 8, 2026 &rarr;</small></a>
</main>
</body>
</html>
